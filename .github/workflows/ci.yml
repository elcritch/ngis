name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'

      - name: Add Atlas to PATH
        run: echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"

      - name: Install Atlas
        shell: bash
        run: curl -fsSL https://raw.githubusercontent.com/nim-lang/atlas/HEAD/install.sh | bash -

      - name: Test core before installing GDAL
        run: atlas-run tests ngis mapping mapprojection metricgrid localidw polygonqueries polygonindex

      - name: Install GDAL
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: ngis-ci
          create-args: >-
            -c conda-forge
            libgdal-core=3.13.3

      - name: Install dependencies
        shell: micromamba-shell {0}
        run: atlas install

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install binding audit tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libclang-dev python3-venv
          python3 -m venv /tmp/ngis-bindgen
          /tmp/ngis-bindgen/bin/pip install clang==18.1.8

      - name: Audit public C coverage and signatures
        shell: micromamba-shell {0}
        run: |
          /tmp/ngis-bindgen/bin/python scripts/audit_headers.py
          /tmp/ngis-bindgen/bin/python scripts/check_function_abi.py
          python3 scripts/gdal_macros.py
          git diff --exit-code -- src/ngis/gdal/api/macro_inventory.json

      - name: Run tests
        shell: micromamba-shell {0}
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          test "$(gdal-config --version)" = 3.13.3
          atlas-run tests

      - name: Test explicit runtime loading
        shell: micromamba-shell {0}
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          atlas-run tests gdal_runtime -- -d:gdalRuntime

      - name: Test standalone mapping on JavaScript
        run: atlas-run tests --backend:js ngis mapping mapprojection metricgrid localidw polygonqueries polygonindex

      - name: Compile examples
        shell: micromamba-shell {0}
        run: atlas-run tests --compile-only examples/all_compile.nim
