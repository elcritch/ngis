name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'

      - name: Add Atlas to PATH
        run: echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"

      - name: Install Atlas
        shell: bash
        run: curl -fsSL https://raw.githubusercontent.com/nim-lang/atlas/HEAD/install.sh | bash -

      - name: Install GDAL
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: ngis-ci
          create-args: >-
            -c conda-forge
            libgdal-core=3.13.3

      - name: Install dependencies
        shell: micromamba-shell {0}
        run: atlas install

      - name: Run tests
        shell: micromamba-shell {0}
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          test "$(gdal-config --version)" = 3.13.3
          atlas-run tests

      - name: Compile examples
        shell: micromamba-shell {0}
        run: atlas-run tests --compile-only examples/all_compile.nim
